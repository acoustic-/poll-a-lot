
<div class="flex movie-search-result">
  <div class="movie-search-result-poster">
    <poster
      [movieId]="movie.id"
      [posterPath]="movie.poster_path"
      [rating]="movie.vote_average"
      size="xxs"
      [hideBorder]="true"
    ></poster>
  </div>

  <div class="movie-search-result title">
    {{ movie.title }}
    @if (movie.release_date) {
      ({{ movie.release_date | date : "y" }})
      }
      @if (letterboxdSeen?.watched) {
        <letterboxd-badge
          [chip]="true"
          label="Seen"
          [size]="10"
          class="search-result-seen-badge"
          [matTooltip]="'Watched on Letterboxd' + (letterboxdSeen.whenWatched ? (' · ' + (letterboxdSeen.whenWatched | date:'d MMM y')) : '')"
        ></letterboxd-badge>
      }<br />
      @if (movie.title !== movie.original_title) {
        <span class="original-title"
          >{{ movie.original_title }}</span
          >
        }
      </div>
    </div>
