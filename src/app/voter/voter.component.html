<div
  class="voter-container cursor-pointer"
  [class.voted]="hasVoted"
  [class.voting-locked]="locked"
  [ngClass]="'size-' + size"
  (click)="clicked()"
  matRipple
  matRippleColor="#d9c6ee"
  [matRippleDisabled]="locked"
>
  @let voters = voters$ | async;
  <div
    class="votes"
    [class.votes-filtered]="voters.length !== pollItem.voters.length"
    [matTooltip]="voters | voters : 'Voters: ' : true"
  >
    <span>{{ voters.length }}</span>
  </div>
  <div class="button-container">
    <div color="primary" class="favorite">
      <mat-icon class="heart-icon">favorite</mat-icon>
    </div>
  </div>
</div>
