<div
  class="voter-container"
  [class.cursor-pointer]="!pointVoting"
  [class.voted]="isVoted"
  [class.voting-locked]="locked"
  [ngClass]="'size-' + size"
  (click)="clicked()"
  matRipple
  matRippleColor="#d9c6ee"
  [matRippleDisabled]="locked || pointVoting"
>
  @let voters = voters$ | async;
  <div
    class="votes"
    [class.votes-filtered]="voters.length !== pollItem.voters.length"
    [matTooltip]="voters | voters : 'Voters: ' : true"
  >
    <span>{{ votesTotal(voters) }}</span>
  </div>
  <div class="button-container">
    @if (pointVoting) {
      <ng-content select="point-vote-stepper"></ng-content>
    } @else {
      <div color="primary" class="favorite">
        <mat-icon class="heart-icon">favorite</mat-icon>
      </div>
    }
  </div>
</div>
