<div class="dialog-content" mat-dialog-content>
  <h2>My streaming services</h2>
  <div class="filter-row">
    <mat-icon class="filter-icon">search</mat-icon>
    <input
      class="filter-input"
      [(ngModel)]="filterText"
      placeholder="Filter services…"
      autocomplete="off"
    />
    @if (filterText) {
      <button mat-icon-button class="filter-clear" (click)="filterText = ''">
        <mat-icon>close</mat-icon>
      </button>
    }
  </div>
  @if ({ available: availableWatchProviders$ | async, selected: tmpSelectedWatchProviders }; as status) {
  <div class="watch-providers-container">
    <div class="scrollable-container">
      @for (provider of filteredProviders(status.available); track provider.provider_id) {
      <div
        class="watch-provider"
        [class.selected]="
        status.selected.length === 0 ||
        status.selected.includes(provider.provider_id)
      "
      >
        <mat-checkbox
          [ngModel]="status.selected.includes(provider.provider_id)"
          (change)="toggleWatchProvider(provider.provider_id)"
        >
        </mat-checkbox>
        <div
          class="watch-provider-image"
          [ngStyle]="{
        'background-image': provider.logo_path
          ? 'url(https://image.tmdb.org/t/p/' +
            'w154' +
            provider.logo_path +
            ')'
          : 'linear-gradient(to top, #fbc2eb 0%, #a6c1ee 100%)'
      }"
        ></div>
        {{ provider.provider_name }}
      </div>
      }
    </div>
  </div>
  }
</div>
<div class="dialog-actions">
  <button
    mat-button
    color="primary"
    aria-label="Close"
    (click)="closeDialog()"
  >
    Close
  </button>
  <button
    mat-raised-button
    [disabled]="watchProvidersChanged(tmpSelectedWatchProviders, selectedWatchProviders$ | async)"
    color="primary"
    aria-label="Save"
    (click)="save()"
  >
    Save
  </button>
</div>
