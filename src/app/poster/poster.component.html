

@if (posterPath || externalPosterUrl) {
  <div class="poster-container" [ngClass]="size + '-size'" [class.fit-container]="fit">
    @if (!hideBorder) {
      <div
        [lazyLoad]="externalPosterUrl || ('https://image.tmdb.org/t/p/w92/' + posterPath)"
        class="poster-border fade-in-out"
      ></div>
    }
    @if (externalPosterUrl) {
      <img
        [attr.tabindex]="allowFullscreen || movieClicked.observed ? 0 : null"
        [attr.role]="allowFullscreen || movieClicked.observed ? 'button' : null"
        (click)="allowFullscreen ? fullscreen = !fullscreen : movieClicked.emit();"
        (keydown.enter)="allowFullscreen ? fullscreen = !fullscreen : movieClicked.observed && movieClicked.emit();"
        (keydown.space)="(allowFullscreen ? fullscreen = !fullscreen : movieClicked.observed && movieClicked.emit()); $event.preventDefault()"
        [class.cursor-pointer]="allowFullscreen"
        cdkOverlayOrigin #trigger="cdkOverlayOrigin"
        class="poster fade-in-out"
        alt="Movie poster"
        [lazyLoad]="externalPosterUrl"
        [defaultImage]="'/assets/img/poster-placeholder.gif'"
        [errorImage]="'/assets/img/poster-placeholder.png'"
        />
    } @else if (posterPath) {
      <img
        [attr.tabindex]="allowFullscreen || movieClicked.observed ? 0 : null"
        [attr.role]="allowFullscreen || movieClicked.observed ? 'button' : null"
        (click)="allowFullscreen ? fullscreen = !fullscreen : movieClicked.emit();"
        (keydown.enter)="allowFullscreen ? fullscreen = !fullscreen : movieClicked.observed && movieClicked.emit();"
        (keydown.space)="(allowFullscreen ? fullscreen = !fullscreen : movieClicked.observed && movieClicked.emit()); $event.preventDefault()"
        [class.cursor-pointer]="allowFullscreen"
        cdkOverlayOrigin #trigger="cdkOverlayOrigin"
        class="poster fade-in-out"
        alt="Movie poster"
      [lazyLoad]="
        'https://image.tmdb.org/t/p/w92' +
        posterPath +
        ' 150w,' +
        'https://image.tmdb.org/t/p/w154' +
        posterPath +
        ' 300w,' +
        'https://image.tmdb.org/t/p/w185' +
        posterPath +
        ' 380w,' +
        'https://image.tmdb.org/t/p/w342' +
        posterPath +
        ' 700w,' +
        'https://image.tmdb.org/t/p/w500' +
        posterPath +
        ' 1000w,' +
        'https://image.tmdb.org/t/p/w780' +
        posterPath +
        ' 1400w'
      "
        [useSrcset]="true"
        [defaultImage]="'/assets/img/poster-placeholder.gif'"
        [errorImage]="'/assets/img/poster-placeholder.png'"
        />
    }

    @if (rating) {
      <movie-score
        class="cursor-pointer"
        (click)="openTmdb(movieId)"
        [value]="rating"
      [size]="ratingSize ? ratingSize :
        size === 'grid' || size === 'xs'
          ? 'xs'
          : size === 's'
          ? 's'
          : size === 'xxs'
          ? 'xxs'
          : 'm'
      "
      ></movie-score>
    }
    @if (showWatchlistMarker) {
      <watch-list-marker
        [movieId]="movieId"
        [size]="size"
      ></watch-list-marker>
    }
  </div>
  
  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOpen]="fullscreen"
  >
  <div
    class="fullscreen-container"
    tabindex="0"
    role="button"
    (click)="fullscreen = false"
    (keydown.enter)="fullscreen = false"
    (keydown.space)="fullscreen = false; $event.preventDefault()"
  >
    <mat-icon class="fullscreen-close cursor-pointer" (click)="fullscreen = false" type="button">close</mat-icon>
    <img
    class="fullscreen-poster"
    alt="Movie poster"
    [lazyLoad]="externalPosterUrl || (
      'https://image.tmdb.org/t/p/w92' +
      posterPath +
      ' 92w,' +
      'https://image.tmdb.org/t/p/w154' +
      posterPath +
      ' 154w,' +
      'https://image.tmdb.org/t/p/w185' +
      posterPath +
      ' 185w,' +
      'https://image.tmdb.org/t/p/w342' +
      posterPath +
      ' 342w,' +
      'https://image.tmdb.org/t/p/w500' +
      posterPath +
      ' 500w,' +
      'https://image.tmdb.org/t/p/w780' +
      posterPath +
      ' 780w'
    )"
    [useSrcset]="!externalPosterUrl"
    [defaultImage]="'/assets/img/poster-placeholder.gif'"
    [errorImage]="'/assets/img/poster-placeholder.png'"
    />
  </div>
  </ng-template>
} @else {
  <div class="poster-container" [ngClass]="size + '-size'">
    <div class="loading-poster loading-image poster-mockup">
      <div class="loading-movie-score" [ngClass]="size + '-size'"></div>
    </div>
  </div>
}
