<h1 mat-dialog-title>Search movies</h1>
<div mat-dialog-content>
  <movie-search-input
    [recentSearchCount]="recentSearchCount"
    [rounded]="true"
    (movieSelected)="movieSelected($event)"
  ></movie-search-input>
</div>
<div mat-dialog-actions class="flex">
  <button class="close" mat-button mat-dialog-close aria-label="Close">
    Close
  </button>
</div>
