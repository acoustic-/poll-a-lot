name: Deploy

# docs/firebase-deploy-ci-plan.md: deploys hosting + functions + firestore
# rules to the poll-a-lot Firebase project, matching the scope of the
# existing `yarn deploy` script. Chains off E2E (the release gate) rather
# than re-running the full E2E suite here or adding a second push trigger —
# see the plan doc §5 for the branch-protection assumption this depends on.
on:
  workflow_run:
    workflows: ["E2E"]
    types: [completed]

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - run: corepack enable
      - run: yarn install --frozen-lockfile

      # functions/ is its own package (own yarn.lock, not a workspace of the
      # root package.json) — the root install above doesn't touch it. Without
      # this, firebase.json's functions predeploy hooks ("yarn --cwd
      # functions lint" / "build") fail with "eslint: not found" the moment
      # they run, since functions/node_modules never existed. The local
      # `yarn deploy` script has this same gap; it only works for a developer
      # whose functions/node_modules already exists from prior manual setup —
      # CI starts from a clean checkout every time.
      - name: Install functions dependencies
        run: yarn --cwd functions install --frozen-lockfile

      # angular.json's "production" configuration only *replaces*
      # environment.ts with environment.prod.ts's content at build time
      # (fileReplacements) — it still needs environment.ts to physically
      # exist to resolve the import in the first place (same gotcha as
      # e2e.yml's environment materialization). Its content is irrelevant
      # since fileReplacements swaps it out before the app ever runs, so the
      # gitignored placeholder template is fine here.
      - name: Materialize environment.ts (placeholder, replaced at build time)
        run: cp src/environments/environment.template.ts src/environments/environment.ts

      - name: Materialize environment.prod.ts
        run: printf '%s' "$ENVIRONMENT_PROD_TS" > src/environments/environment.prod.ts
        env:
          ENVIRONMENT_PROD_TS: ${{ secrets.ENVIRONMENT_PROD_TS }}

      - name: Build (production)
        run: yarn build

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase (hosting + functions + firestore rules)
        run: npx firebase-tools deploy --project poll-a-lot --non-interactive
