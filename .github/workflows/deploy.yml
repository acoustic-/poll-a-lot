name: Deploy

# docs/firebase-deploy-ci-plan.md: deploys hosting + functions + firestore
# rules to the poll-a-lot Firebase project, matching the scope of the
# existing `yarn deploy` script. Chains off E2E (the release gate) rather
# than re-running the full E2E suite here or adding a second push trigger —
# see the plan doc §5 for the branch-protection assumption this depends on.
on:
  workflow_run:
    workflows: ["E2E"]
    types: [completed]

jobs:
  # semantic-release (.releaserc.json): derives the next version from commits
  # since the last vX.Y.Z tag (any commit bumps at least a patch — see the
  # catch-all releaseRules entry), then bumps package.json, updates
  # CHANGELOG.md, tags, and publishes a GitHub Release. It pushes that bump
  # commit straight to master with "[skip ci]", which the deploy job below
  # picks up (it checks out the `master` ref, not a pinned SHA) and which
  # keeps ci.yml/e2e.yml's push:master triggers from re-firing on it.
  # Requires a bootstrap tag (e.g. `v6.3.0` on the commit package.json was
  # last hand-bumped to) to exist before this runs for the first time —
  # semantic-release treats a tagless repo as pre-1.0.0 and would otherwise
  # reset the version instead of continuing from it.
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # GITHUB_TOKEN (github-actions[bot]) can't push straight to master:
      # it's rejected by the branch protection's required "unit" status
      # check, which only exempts accounts holding the repo's Admin role
      # (classic branch-protection bypass) — a bot identity can't hold
      # that role, and it also doesn't show up as a selectable "App" in a
      # ruleset's bypass list (that list is populated from GitHub Apps
      # actually installed on the repo, which Actions isn't one of).
      # RELEASE_TOKEN is a PAT from an admin account, which does bypass.
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - run: corepack enable
      - run: yarn install --frozen-lockfile

      - name: Release (version bump, tag, changelog, GitHub release)
        run: yarn release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - run: corepack enable
      - run: yarn install --frozen-lockfile

      # functions/ is its own package (own yarn.lock, not a workspace of the
      # root package.json) — the root install above doesn't touch it. Without
      # this, firebase.json's functions predeploy hooks ("yarn --cwd
      # functions lint" / "build") fail with "eslint: not found" the moment
      # they run, since functions/node_modules never existed. The local
      # `yarn deploy` script has this same gap; it only works for a developer
      # whose functions/node_modules already exists from prior manual setup —
      # CI starts from a clean checkout every time.
      - name: Install functions dependencies
        run: yarn --cwd functions install --frozen-lockfile

      # angular.json's "production" configuration only *replaces*
      # environment.ts with environment.prod.ts's content at build time
      # (fileReplacements) — it still needs environment.ts to physically
      # exist to resolve the import in the first place (same gotcha as
      # e2e.yml's environment materialization). Its content is irrelevant
      # since fileReplacements swaps it out before the app ever runs, so the
      # gitignored placeholder template is fine here.
      - name: Materialize environment.ts (placeholder, replaced at build time)
        run: cp src/environments/environment.template.ts src/environments/environment.ts

      - name: Materialize environment.prod.ts
        run: printf '%s' "$ENVIRONMENT_PROD_TS" > src/environments/environment.prod.ts
        env:
          ENVIRONMENT_PROD_TS: ${{ secrets.ENVIRONMENT_PROD_TS }}

      # version.ts is gitignored (see src/environments/version.template.ts) —
      # this is the one build that writes the real thing, from the commit the
      # `release` job just pushed to master (this checkout's HEAD), so the
      # footer shows the version/commit actually being deployed rather than
      # the pre-release-job commit `github.sha` would still point to.
      - name: Generate version.ts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          COMMIT_SHA=$(git rev-parse --short HEAD)
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > src/environments/version.ts <<EOF
          export const VERSION = {
            version: '${VERSION}',
            commit: '${COMMIT_SHA}',
            runNumber: '${{ github.run_number }}',
            builtAt: '${BUILT_AT}',
          };
          EOF

      - name: Build (production)
        run: yarn build

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase (hosting + functions + firestore rules)
        run: npx firebase-tools deploy --project poll-a-lot --non-interactive
