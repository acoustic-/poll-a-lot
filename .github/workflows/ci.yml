name: CI

# Fast checks, per docs/regression-test-plan.md section 6: unit tests plus the
# import-cycle guard (T1) that catches a class of NG0919 failures (D1) at
# build time instead of at runtime. Runs on every PR so nothing merges without
# it, regardless of which files changed.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - run: corepack enable
      - run: yarn install --frozen-lockfile

      # src/environments/environment.ts is gitignored (real keys, never
      # committed); the checked-in template's placeholder values are fine
      # here since unit tests don't call real APIs. Without this, `yarn test`
      # can't resolve `../../environments/environment` (imported by
      # src/main.ts and settings.component.ts) and fails to compile.
      - name: Materialize dev environment.ts (placeholder values)
        run: cp src/environments/environment.template.ts src/environments/environment.ts

      - name: Unit tests (ng test)
        run: yarn test

      - name: Import-cycle guard
        run: yarn test:cycles
