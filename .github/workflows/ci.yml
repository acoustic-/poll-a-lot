name: CI

# Fast checks, per docs/regression-test-plan.md section 6: unit tests plus the
# import-cycle guard (T1) that catches a class of NG0919 failures (D1) at
# build time instead of at runtime. Runs on every PR so nothing merges without
# it, regardless of which files changed.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - run: corepack enable
      - run: yarn install --frozen-lockfile

      # src/environments/environment.ts is gitignored (real keys, never
      # committed); the checked-in template's placeholder values are fine
      # here since unit tests don't call real APIs. Without this, `yarn test`
      # can't resolve `../../environments/environment` (imported by
      # src/main.ts and settings.component.ts) and fails to compile.
      - name: Materialize dev environment.ts (placeholder values)
        run: cp src/environments/environment.template.ts src/environments/environment.ts

      # version.ts is gitignored (see .github/workflows/deploy.yml's "Generate
      # version.ts" step, which is the only place that writes the real one) —
      # footer.component.ts imports it, so unit tests need a placeholder to
      # resolve the import.
      - name: Materialize dev version.ts (placeholder)
        run: cp src/environments/version.template.ts src/environments/version.ts

      - name: Unit tests (ng test)
        run: yarn test

      - name: Import-cycle guard
        run: yarn test:cycles

  # functions/ is its own package (own yarn.lock, not a workspace of the root
  # package.json — see deploy.yml's "Install functions dependencies" step for
  # the same gotcha). Its lint step is also a Firebase predeploy hook, so a
  # lint error here previously only surfaced by failing the actual production
  # deploy after merge — this catches it on every PR instead.
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - run: corepack enable
      - run: yarn --cwd functions install --frozen-lockfile

      - name: Lint (matches firebase.json's functions predeploy hook)
        run: yarn --cwd functions lint

      - name: Unit tests (jasmine)
        run: yarn --cwd functions test
