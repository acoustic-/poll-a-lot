name: E2E

# docs/regression-test-plan.md section 6: the release-gate flows (add movie
# item, vote, point-vote, login, create poll, My Polls, layout/overflow) —
# only these actually exercise D1/D2/D3, so this only needs to run on PRs
# that touch src/ or the e2e harness itself (a broken fixture/helper is just
# as much a reason to gate merging as a broken component) and unconditionally
# on master, as a release gate.
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
  push:
    branches: [master]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      # The Firestore/Auth emulators (started by playwright.config.ts's
      # webServer) run on the JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: corepack enable
      - run: yarn install --frozen-lockfile

      # src/environments/environment.e2e.ts is gitignored (real keys, never
      # committed). Its own template comment confirms placeholder values are
      # fine here: app.module.ts redirects Firestore/Auth to the local
      # emulators whenever useEmulators is true, regardless of the fake
      # firebase config, and no current e2e spec needs real TMDB/OMDB/
      # Letterboxd data. Without this, `ng serve --configuration=e2e` (one of
      # playwright.config.ts's webServer entries) fails immediately with
      # "path in file replacements does not exist" before Playwright ever
      # gets to run a test.
      #
      # angular.json's "e2e" configuration only *replaces* environment.ts
      # with environment.e2e.ts's content at build time (fileReplacements) —
      # it still needs environment.ts to physically exist to resolve the
      # import in the first place, so both files have to be materialized.
      - name: Materialize e2e environment files (placeholder values)
        run: |
          cp src/environments/environment.template.ts src/environments/environment.ts
          cp src/environments/environment.e2e.template.ts src/environments/environment.e2e.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (both projects — chromium, Mobile Chrome)
        run: yarn test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
